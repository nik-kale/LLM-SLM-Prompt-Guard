name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  packages: write

jobs:
  build-python:
    name: Build Python Package
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: |
          pip install build twine

      - name: Build package
        run: |
          cd packages/python
          python -m build

      - name: Check package
        run: |
          cd packages/python
          twine check dist/*

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: packages/python/dist/

  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: build-python
    env:
      PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}

    steps:
      - name: Skip without PYPI_API_TOKEN
        if: env.PYPI_API_TOKEN == ''
        run: echo "::notice::PYPI_API_TOKEN is not configured; skipping PyPI upload"

      - name: Download dist artifacts
        if: env.PYPI_API_TOKEN != ''
        uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist/

      - name: Publish to PyPI
        if: env.PYPI_API_TOKEN != ''
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ env.PYPI_API_TOKEN }}
          packages-dir: dist/

  build-docker:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Image names must be lowercase; Docker Hub tags are only added when
      # Docker Hub credentials are configured.
      - name: Compute image tags
        id: tags
        run: |
          version="${GITHUB_REF#refs/tags/v}"
          image="ghcr.io/${GITHUB_REPOSITORY,,}/proxy"
          tags="${image}:latest,${image}:${version}"
          if [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
            tags="${tags},${DOCKERHUB_USERNAME}/prompt-guard-proxy:latest"
            tags="${tags},${DOCKERHUB_USERNAME}/prompt-guard-proxy:${version}"
          fi
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          target: proxy
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-python, build-docker]

    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Download Python dist
        uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist/

      - name: Detect pre-release
        id: prerelease
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          case "$VERSION" in
            *rc*|*alpha*|*beta*) echo "value=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "value=false" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release v${{ steps.version.outputs.VERSION }}
          generate_release_notes: true
          files: |
            dist/*
          draft: false
          prerelease: ${{ steps.prerelease.outputs.value }}

  notify-release:
    name: Notify Release
    runs-on: ubuntu-latest
    needs: [publish-pypi, build-docker, create-release]
    if: always()

    steps:
      - name: Send notification
        run: |
          echo "🎉 Release completed!"
          echo "PyPI: ${{ needs.publish-pypi.result }}"
          echo "Docker: ${{ needs.build-docker.result }}"
          echo "GitHub Release: ${{ needs.create-release.result }}"
