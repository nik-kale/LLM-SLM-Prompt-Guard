name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  python-tests:
    name: Python Tests (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: packages/python/pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e "packages/python[dev,proxy,faker,cryptography,opentelemetry]"

      - name: Run library tests
        working-directory: packages/python
        run: pytest tests/unit tests/integration tests/security

      - name: Run proxy tests
        working-directory: packages/proxy
        run: pytest tests -p no:cacheprovider

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.11' && env.CODECOV_TOKEN != ''
        uses: codecov/codecov-action@v4
        with:
          token: ${{ env.CODECOV_TOKEN }}
          files: ./packages/python/coverage.xml
          flags: python
          fail_ci_if_error: false

  package:
    name: Build and Install Package
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build packages/python --outdir dist
          twine check dist/*

      # Runs outside the checkout so the installed wheel, not the source
      # tree, is imported (catches files missing from the wheel).
      - name: Smoke-test the installed wheel
        working-directory: ${{ runner.temp }}
        run: |
          python -m venv wheel-env
          wheel-env/bin/pip install "$GITHUB_WORKSPACE"/dist/*.whl
          wheel-env/bin/python - <<'EOF'
          from prompt_guard import PromptGuard
          text, mapping = PromptGuard().anonymize("Mail a@example.com")
          assert text == "Mail [EMAIL_1]", text
          EOF
          wheel-env/bin/prompt-guard list-policies

  benchmarks:
    name: Performance Benchmarks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: packages/python/pyproject.toml

      - name: Install dependencies
        run: pip install -e "packages/python[dev]"

      - name: Run performance tests and benchmarks
        working-directory: packages/python
        run: pytest tests/performance --benchmark-enable --benchmark-json=benchmark-results.json

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: packages/python/benchmark-results.json

  node-build:
    name: Node Build (${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ["20.x", "22.x"]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        working-directory: packages/node
        run: npm install --no-audit --no-fund

      - name: Build
        working-directory: packages/node
        run: npm run build

  evaluation:
    name: Run Evaluation Scripts
    runs-on: ubuntu-latest
    needs: [python-tests]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: packages/python/pyproject.toml

      - name: Install dependencies
        run: pip install -e packages/python

      - name: Run PII detection evaluation
        working-directory: eval/scripts
        run: python evaluate_pii_detection.py

      - name: Run utility evaluation
        working-directory: eval/scripts
        run: python evaluate_pii_vs_utility.py

      - name: Upload evaluation results
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-results
          path: eval/results/

  examples:
    name: Check Examples
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile Python examples
        run: python -m py_compile examples/*.py examples/*/main.py

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"

      # The example imports the package sources from outside its tsconfig
      # rootDir, so it is type-checked rather than built.
      - name: Type-check Express example
        run: |
          npm install --prefix packages/node --no-audit --no-fund
          npm install --prefix examples/node-express-chat --no-audit --no-fund
          cd examples/node-express-chat
          npx tsc --noEmit -p . --rootDir ../..
