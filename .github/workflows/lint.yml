name: Lint & Type Check

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  lint-python:
    name: Python Linting
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: packages/python/pyproject.toml

      - name: Install dependencies
        run: pip install -e "packages/python[dev]"

      # The rule set is pinned in packages/python/pyproject.toml
      - name: Run ruff check
        working-directory: packages/python
        run: ruff check src/ tests/ ../proxy/ --output-format=github

      - name: Run mypy type checking
        working-directory: packages/python
        run: mypy src/ --ignore-missing-imports

  lint-markdown:
    name: Markdown Linting
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Rules are configured in .markdownlint-cli2.yaml
      - name: Lint markdown files
        uses: DavidAnson/markdownlint-cli2-action@v14
        with:
          globs: |
            **/*.md
            !**/node_modules/**

  lint-yaml:
    name: YAML Linting
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Lint YAML files
        uses: ibiqlik/action-yamllint@v3
        with:
          file_or_dir: |
            .github/workflows/
            packages/python/src/prompt_guard/policies/
            deploy/kubernetes/
          config_file: .yamllint.yml
          strict: true

  lint-docker:
    name: Docker Linting
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: warning

  lint-terraform:
    name: Terraform Linting
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform fmt check
        working-directory: deploy/terraform
        run: terraform fmt -check -recursive

      # main.tf calls ./modules/{vpc,rds,elasticache,ecs}, which are not in
      # the repository yet, so `terraform init` cannot succeed. Validation
      # starts automatically once the modules are added.
      - name: Terraform validate
        working-directory: deploy/terraform
        run: |
          if [ ! -d modules ]; then
            echo "::warning file=deploy/terraform/main.tf::terraform validate skipped: modules/ is missing"
            exit 0
          fi
          terraform init -backend=false
          terraform validate

  lint-summary:
    name: Lint Summary
    runs-on: ubuntu-latest
    needs: [lint-python, lint-markdown, lint-yaml, lint-docker, lint-terraform]
    if: always()

    steps:
      - name: Check lint results
        run: |
          if [ "${{ needs.lint-python.result }}" != "success" ]; then
            echo "❌ Python linting failed"
            exit 1
          fi
          if [ "${{ needs.lint-markdown.result }}" != "success" ]; then
            echo "⚠️ Markdown linting failed"
          fi
          if [ "${{ needs.lint-yaml.result }}" != "success" ]; then
            echo "⚠️ YAML linting failed"
          fi
          if [ "${{ needs.lint-docker.result }}" != "success" ]; then
            echo "⚠️ Docker linting failed"
          fi
          if [ "${{ needs.lint-terraform.result }}" != "success" ]; then
            echo "⚠️ Terraform linting failed"
          fi
          echo "✅ Critical linting checks passed"
